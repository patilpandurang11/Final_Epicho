version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: epicho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epicho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epicho_dev_password}
      POSTGRES_DB: epicho
    ports:
      - "5432:5432"
    volumes:
      - epicho_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epicho -d epicho"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: epicho-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - epicho_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epicho-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://epicho:${POSTGRES_PASSWORD:-epicho_dev_password}@postgres:5432/epicho
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: epicho-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  epicho_pg_data:
  epicho_redis_data:
